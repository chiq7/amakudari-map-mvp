name: Daily low-risk data update

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pick one pre-validated unreleased record
        id: pick
        run: npm run pick:pool -- --count 1

      - name: Generate merged production candidate
        if: steps.pick.outputs.picked_count != '0'
        run: >
          npm run generate:candidate --
          --file data/draft/pending/daily-pick.json
          --merge-production

      - name: Validate candidate
        if: steps.pick.outputs.picked_count != '0'
        run: npm run validate:candidate

      - name: Apply candidate to workflow branch
        if: steps.pick.outputs.picked_count != '0'
        run: >
          npm run apply:candidate --
          --archive-label daily-${{ github.run_id }}

      - name: Validate production data
        if: steps.pick.outputs.picked_count != '0'
        run: npm run validate:data

      - name: Generate review-only social content queue
        if: steps.pick.outputs.picked_count != '0'
        run: npm run generate:social-queue -- --input data/draft/pending/daily-pick.json --limit 1

      - name: Validate social content queue
        if: steps.pick.outputs.picked_count != '0'
        run: npm run validate:social-queue

      - name: Validate news content
        if: steps.pick.outputs.picked_count != '0'
        run: npm run validate:news

      - name: Generate content check
        if: steps.pick.outputs.picked_count != '0'
        run: npm run generate:content

      - name: Type check
        if: steps.pick.outputs.picked_count != '0'
        run: npx tsc --noEmit

      - name: Build
        if: steps.pick.outputs.picked_count != '0'
        run: npm run build

      - name: Commit verified production update
        if: steps.pick.outputs.picked_count != '0'
        run: |
          git config user.name "amakudari-map automation"
          git config user.email "amakudari-map-automation@users.noreply.github.com"
          git add data/production data/pool/unreleased_records.json data/social
          if git diff --cached --quiet; then
            echo "No verified production change to publish."
            exit 0
          fi
          git commit -m "chore: publish daily verified data update (${{ steps.pick.outputs.picked_count }} record)"
          git push origin HEAD:master
